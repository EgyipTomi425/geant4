name: Validate generator

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Validate JSON and Python syntax
        run: |
          python -m json.tool scripts/config.json >/dev/null
          python -m compileall -q scripts tests
      - name: Validate updater syntax
        run: bash -n update.sh
      - name: Install CSV converter test dependencies
        run: python -m pip install numpy awkward uproot tqdm
      - name: Run config and job-planning tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test default configuration
        run: python scripts/run_simulations.py --config scripts/config.json --dry-run

  simulation-integration:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    needs: validate
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Enable Apptainer user namespaces on the ephemeral runner
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          unshare --user --map-root-user true
      - name: Select daily EIC image cache key
        id: eic-cache-key
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Cache the EIC base SIF
        id: eic-cache
        uses: actions/cache@v4
        with:
          path: .build/eic_xl-nightly.sif
          key: eic-xl-nightly-${{ runner.os }}-${{ runner.arch }}-${{ steps.eic-cache-key.outputs.day }}
      - name: Build the generator image
        run: |
          if [ -f .build/eic_xl-nightly.sif ]; then
            ./update.sh --base-sif "$PWD/.build/eic_xl-nightly.sif"
          else
            ./update.sh
          fi
      - name: Verify current-directory config discovery
        working-directory: apptainer
        run: ./geant-generator.sif --dry-run
      - name: Run all jobs from the default JSON config
        working-directory: apptainer
        run: ./geant-generator.sif --config ./config.json --events 100 --jobs 2
      - name: Verify generated ROOT and CSV files
        run: |
          root_count="$(find apptainer/output/roots -type f -name '*.root' | wc -l)"
          csv_count="$(find apptainer/output/csv -type f -name '*.csv' | wc -l)"
          test "$root_count" -eq 16 || {
            echo "Expected 16 ROOT files, found $root_count" >&2
            exit 1
          }
          test "$csv_count" -eq 16 || {
            echo "Expected 16 CSV files, found $csv_count" >&2
            exit 1
          }
