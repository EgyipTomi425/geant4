name: Validate generator

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Validate JSON and Python syntax
        run: |
          python -m json.tool scripts/config.json >/dev/null
          python -m compileall -q scripts tests
      - name: Validate updater syntax
        run: bash -n update.sh
      - name: Run config and job-planning tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test default configuration
        run: python scripts/run_simulations.py --config scripts/config.json --dry-run

  simulation-integration:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    needs: validate
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Build the generator image
        run: ./update.sh
      - name: Verify current-directory config discovery
        working-directory: apptainer
        run: ./geant-generator.sif --dry-run
      - name: Run all jobs from the default JSON config
        working-directory: apptainer
        run: ./geant-generator.sif --config ./config.json --jobs 2
      - name: Verify generated ROOT and CSV files
        run: |
          root_count="$(find apptainer/output/roots -type f -name '*.root' | wc -l)"
          csv_count="$(find apptainer/output/csv -type f -name '*.csv' | wc -l)"
          test "$root_count" -eq 8 || {
            echo "Expected 8 ROOT files, found $root_count" >&2
            exit 1
          }
          test "$csv_count" -eq 8 || {
            echo "Expected 8 CSV files, found $csv_count" >&2
            exit 1
          }
